# ============================================================================
# dsh-feishu-channel 配置模板
# ============================================================================
# 把本文件内容填好后，粘到 <DSH_HOME>/profiles/<你的 profile>/cordis.patch.yml
#
# ⚠️ 两条硬规则：
#   1. profile 层的 patch 按 id **替换整个 config**（不是深合并），
#      所以下面每一项都要保留（不需要的可以删，但保留的必须写全）。
#   2. 未列出的字段会回落到插件 index.mjs 里的 DEFAULTS。
#
# ============================================================================

# ---- 无头通道 profile 必须关掉它 -------------------------------------------
# `ui-approval` 是 web UI 的审批应答者。它接管 approval/request waterfall 后
# 会一直等浏览器里的点击、永不返回，导致后面的应答者（本插件）根本没机会执行
# —— 表现为 agent 卡死在 running。
#
# ⚠️ 如果你要在**同时开着浏览器界面**的 profile（如 web）里用它，
#    不要照抄这一行：那样浏览器会话的审批弹窗会消失。
#    正确做法是先解决两个应答者的分工（按 agent 来源路由），
#    详见 DESIGN.md 的 M10。
- id: ui-approval
  disabled: true

# ---- 飞书通道插件 -----------------------------------------------------------
- id: feishu-channel
  config:
    # 【必填】lark-cli profile —— 决定用哪个飞书应用
    #   查看命令: lark-cli auth status --profile <profile>
    profile: cli_xxxxxxxxxxxxxxxx

    # 【必填】用户白名单：只有这些 open_id 能驱动 agent。
    #   留空或删掉 = 拒绝一切消息（安全默认）
    #   怎么拿 open_id: lark-cli contact +search-user --query "你的名字" --as user
    allowedOpenIds:
      - ou_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

    # 【必填】新会话的工作目录
    workspacePath: 'C:\你的工作区'

    # 【必填】agent preset —— 决定会话能用哪些工具
    #   不设的话 agent 没有工具，模型会把工具调用吐成纯文本
    agentPreset: standard

    # 【必填】模型路由。
    #   程序化创建的 agent **不会**继承 profile 的默认模型，必须显式给。
    #   且必须用支持工具调用的模型。
    provider: deepseek-official
    model: deepseek-v4-flash

    # 会话 id 前缀（改它可强制新建会话）
    sessionPrefix: 'sess-feishu'

    # chat_id → sessionId 绑定持久化位置。
    # 建议放在 DSH home 下，别混进插件目录
    bindingsFile: 'C:\Users\<你>\.dsh\feishu-channel\bindings.json'

    # 群聊：默认关闭。开启后**只在机器人被 @ 时**响应
    # （需要 botOpenId；拿不到时一律拒绝群消息，fail-closed）
    allowGroupChats: false

    # 机器人自己的 open_id。留空则启动时自动通过
    #   lark-cli api GET /open-apis/bot/v3/info
    # 获取。只有开启群聊时才需要
    botOpenId: ''

    # 是否由本插件接管审批（默认 true：通道 agent 的审批走飞书卡片）
    #
    # ⚠️ 设为 false 时本插件不注册应答者，审批交给同 profile 的其他应答者
    #    （例如 web UI 的 ui-approval）。只有在你**同时开着浏览器界面**
    #    且希望通道 agent 的审批弹在浏览器里时才这样配。
    #    两个应答者同时指望 = 互相压掉 = agent 卡死（见 DESIGN.md M10）
    answerApprovals: true

    # 去重窗口：记住最近多少条事件 id，防止长连接重连 / 事件重投
    # 导致同一条消息被喂给 agent 两次（工具重复执行、回复重复发送）
    dedupWindow: 500

    # 启动时是否连飞书长连接
    autoConnect: true

    # 审批等待决定的超时（毫秒）。超时按 fail-closed 返回 unavailable。
    # 默认 300000 = 5 分钟
    approvalTimeoutMs: 300000

    # 自测入口：启动 3 秒后注入一条合成消息。平时保持关闭。
    selfTest:
      enabled: false

    # lark-cli 可执行文件（默认取 npm 全局安装路径，换机器时覆盖）
    # larkCli: 'C:\Users\<你>\AppData\Roaming\npm\node_modules\@larksuite\cli\bin\lark-cli.exe'
